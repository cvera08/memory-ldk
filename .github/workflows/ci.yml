# Tests run on every push and every pull request.
# The site is only deployed when they pass, and only from master.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the deploy job asks for what it needs.
permissions:
  contents: read

# One deployment at a time. Queued rather than cancelled, so a run that
# is already publishing is never left half finished.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # No install step: the project has no dependencies, by design.
      - name: Run the suites
        run: node tests/run.js

  deploy:
    name: deploy to github pages
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      # Publish only what the browser needs. The readme, the build log, the
      # tests and this workflow stay in the repository where they belong.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html styles.css favicon.svg favicon.ico apple-touch-icon.png _site/
          cp -R js _site/

      # The same wiring suite, pointed at the folder about to go live: a file
      # that was never copied in fails here instead of on the live site.
      - name: Verify the assembled site
        env:
          SITE_ROOT: _site
        run: node tests/assets.test.js

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
